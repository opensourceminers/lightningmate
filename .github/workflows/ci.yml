name: ci

# The gate for every change: install from the lockfile, audit what runs in
# production, type-check the sources AND the tests, check the API contract,
# run the test suite, and build — on Node 22, the same major the Docker image
# runs. Releases (build-image.yml) are cut by tag, by hand (docs/RELEASING.md);
# this workflow is what tells you whether a commit is fit to tag. Actions are
# pinned to commits (Dependabot keeps them current).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The Dockerfile's base image runs this major: a new one changes
          # both in one pull request (server/test/releaseWorkflow.test.ts).
          node-version: 22
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      # A known vulnerability in what runs in production (the server's and
      # the web's runtime dependencies) fails the build. Dev-only tools are
      # kept current by Dependabot (.github/dependabot.yml).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check (server, web, tests)
        run: npm run typecheck

      # One set of payload types for the server and the web: every body a
      # route builds is checked against server/src/apiTypes.ts where it is
      # sent, the web type-checks against those same types, each answer the
      # web reads is paired with what its route sends, and each request body
      # and query string the web sends with the contract type its route reads
      # it as — so a shape that drifts fails here, in either direction, and
      # no hand-kept copy creeps back.
      - name: API contract (shared payload types)
        run: npm run check:api-types

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
