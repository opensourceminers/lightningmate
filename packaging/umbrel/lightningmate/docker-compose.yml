version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: lightningmate_web_1
      APP_PORT: 3001

  web:
    # The image the stores publish now (tag + digest), as in
    # getumbrel/umbrel-apps/lightningmate. A release sets this line to the
    # pin its image workflow prints (docs/RELEASING.md); the version a running
    # install has is shown in the app's footer, in Settings and at /api/health.
    image: ghcr.io/opensourceminers/lightningmate:v0.7.7@sha256:917fa062d9520ea5bf92fb94bbe12b2947ed025c2bd8b82b3dcd5435127392ce
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      # Read-only access to LND's tls.cert + macaroons.
      - ${APP_LIGHTNING_NODE_DATA_DIR}:/lnd:ro
      # App's own writable data dir (autopilot config + rebalance accounting).
      - ${APP_DATA_DIR}/data:/data
    environment:
      APP_LIGHTNING_NODE_IP: "$APP_LIGHTNING_NODE_IP"
      APP_LIGHTNING_NODE_GRPC_PORT: "$APP_LIGHTNING_NODE_GRPC_PORT"
      LND_SOCKET: "$APP_LIGHTNING_NODE_IP:$APP_LIGHTNING_NODE_GRPC_PORT"
      LND_DIR: "/lnd"
      LND_CERT_PATH: "/lnd/tls.cert"
      LND_MACAROON_PATH: "/lnd/data/chain/bitcoin/$APP_BITCOIN_NETWORK/readonly.macaroon"
      DATA_DIR: "/data"
      PORT: "3001"
      # Bind all interfaces so app_proxy (which authenticates) can reach us.
      LM_BIND: "0.0.0.0"
      # Per-install secrets for server-side auth. Other app containers share the
      # Docker network, so the whole API requires a session token proving the
      # per-app password Umbrel shows the user ($APP_PASSWORD, from
      # deterministicPassword); $APP_SEED signs the tokens.
      APP_PASSWORD: "$APP_PASSWORD"
      APP_SEED: "$APP_SEED"
      # Node management needs write access (like RTL / Thunderhub / Lightning
      # Terminal). The autopilot itself stays OFF until the user turns it on, and
      # every fund-moving action asks for confirmation. To run read-only instead,
      # comment these two lines out.
      LM_ENABLE_WRITE: "true"
      LND_WRITE_MACAROON_PATH: "/lnd/data/chain/bitcoin/$APP_BITCOIN_NETWORK/admin.macaroon"
      # The disclosed 1 % service fee on completed sales (Magma and LSPS1),
      # paid in the background to this lightning address — shown in the app
      # before anything is sold. "0" turns it off.
      LM_SELL_FEE_BPS: "100"
      LM_SELL_FEE_ADDRESS: "lightningmate@btcpay.opensourceminers.de"
      # Umbrel's Tor proxy (SOCKS5). LightningMate's own third-party lookups
      # (LN+ reputations — this node's pubkey included — the BTC price and
      # Amboss's public market data) go through it instead of the home
      # connection; Settings → Privacy can route the Amboss account calls through
      # it too. Without these lines they go out directly.
      # NOT YET IN THE STORES' COMPOSE: add both lines there with the next
      # release (docs/RELEASING.md).
      TOR_PROXY_IP: "$TOR_PROXY_IP"
      TOR_PROXY_PORT: "$TOR_PROXY_PORT"
