# Official Umbrel App Store manifest (getumbrel/umbrel-apps/lightningmate):
# what the next update PR publishes there. Per the packaging guide: bare
# `lightningmate` id, NO icon field — the Umbrel team hosts the icon and the
# gallery images. `version` and the image pin (docker-compose.yml) are the
# published 0.7.7's until a release sets them; a release updates them and
# `releaseNotes` here and in both stores: docs/RELEASING.md.
manifestVersion: 1
id: lightningmate
storage:
  dataRoot: data
# The official store still lists `finance` (as published for 0.7.7). The owner
# decided on 2026-10-21 that Lightning Mate is a bitcoin app — like Lightning
# Node, Ride The Lightning, Core Lightning and Lightning Terminal, and as the
# community store lists it: the next official update PR sets `bitcoin` and says
# why in its body (docs/RELEASING.md).
category: bitcoin
name: Lightning Mate
version: "0.7.7"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  Lightning Mate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click, plus a node health score.


  Flip on the Autopilot and the node tunes its own pricing, runs only profitable
  rebalances, and opens channels to top peers — all on recommended settings with
  safe caps and cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right inside the
  app: purchase inbound, list your own offer, and let the Autopilot fulfil orders
  — opening channels to buyers within your capital, channel-size and on-chain
  reserve caps.


  LSP mode (experimental) turns your node into a Lightning Service Provider: wallets
  speaking the open LSPS1 standard (bLIP-51) can buy inbound channels from you
  directly — priced automatically, paid via a hold invoice that only settles
  once the channel is opening, refunded automatically on any failure. Off by
  default.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
# DRAFT notes for the next release — what the 2026-10 review fixes change.
# Before publishing, check them against the release's code and its manual
# end-to-end results (docs/E2E-TESTING.md, docs/RELEASING.md). Never claim that
# price or size wins orders or raises the seller score (D11, D19): Amboss
# decides which seller gets an order. (The published 0.7.7 notes claimed that
# size decides whether a buyer can be matched — disproven; they must not be
# copied out again. server/test/docsMatchCode.test.ts refuses them.)
releaseNotes: |-
  A reliability and honesty release: Magma selling moves to Amboss's new
  Magma API, and every part of the autopilot says what it decided and why.

  Magma selling (off by default)
  - Orders are accepted with a hold invoice: the buyer's payment settles only
    once Amboss confirms the channel, and every failure refunds it.
  - Each order step is recorded before it happens, so a restart never opens a
    second channel, and an order the node can't serve is rejected at once
    rather than left to time out.
  - Offers carry the standard 30-day lease and a routing-fee promise, which
    the fee autopilot keeps for every channel sold.
  - A live check shows how often offers like yours sell. Amboss decides which
    seller gets an order, mostly by track record; price and size don't buy a
    match, and the app no longer says they do.
  - Turning selling on is its own confirmed step; no preset turns it on.

  Autopilot
  - Fees move toward an aim in bounded steps, rise only when a channel drains,
    and a draining channel is priced against what refilling it costs.
  - A refill never pays more than the profit check allowed; the daily budget
    survives restarts and counts refills run by hand.
  - Automatic channel opens pay a capped fee rate and, where the node's
    routing yield is measured, must pay back their on-chain cost within a
    year; a peer that is briefly offline is no reason to close.
  - Presets show what they change before they apply, "Pause all automation"
    switches every autopilot automation off at once (LSP mode, a Settings
    switch, keeps running and says so), and each area says what it last
    decided and why.

  Profit & loss
  - Every cost counts: closes and their sweeps, rebalances made with any tool,
    inbound bought on Magma.

  Wallet and LSP mode
  - An on-chain send shows its fee in sats and asks again before it overpays
    or dips into the reserve.
  - LSP mode (experimental, off by default) accepts the order request of
    ZEUS's embedded node; orders are paced and capped.

  Privacy and security
  - With Umbrel's Tor proxy, the app's own lookups (LN+, the BTC price, Amboss
    market data) go through Tor; Settings → Privacy lists every destination.
  - The API refuses requests a browser marks as cross-site.
